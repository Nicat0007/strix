# Custom, narrow, high-precision semgrep rules layered on top of the public
# p/default + p/golang + p/secrets registry packs used by
# custom/source_aware_sast.md's baseline bundle. These do NOT replace the
# LLM-reasoning FP-control model (counterevidence.md still governs whether
# anything here becomes a report) — they exist purely to reduce how much
# scanner noise the agent has to wade through before it gets there, by
# being precise enough that a hit is very likely worth tracing.
#
# Every rule below was written and tested against a real WordPress plugin
# (the optistate calibration target) with a known, manually-verified
# true positive (a hardcoded Google API key reaching an encrypt/default
# sink) and multiple manually-verified-safe call sites (prepared queries,
# is_serialized()+allowed_classes-restricted unserialize, identifier
# escaping before concatenation). Each rule's comment states the specific
# safe pattern it was tested against and confirmed NOT to fire on.

rules:
  # ---------------------------------------------------------------------
  # Rule 1: hardcoded cloud-provider key literal reaching an
  # encrypt/default/option-shaped sink.
  #
  # Matches: a string literal whose shape matches a known cloud API key
  # format, passed as an argument to ANY call whose callee name contains
  # "encrypt", "default", or "option" (case-insensitive) — e.g.
  # OPTISTATE_Utils::encrypt_data("AIzaSy..."), update_option($k, "AIza...").
  #
  # Does NOT match (tested, confirmed clean):
  #   - the same literal in a `//` or `/* */` comment (semgrep matches AST
  #     nodes, not comment text, so this is structurally impossible, not
  #     just untested)
  #   - a key-shaped literal that never reaches a sink (e.g. logged via
  #     error_log(), passed to an unrelated function name)
  #   - a non-key-shaped literal reaching a real sink (e.g.
  #     update_option("some_default_setting", "not-a-real-key"))
  # This is why the rule is two independent metavariable-regex
  # constraints (on the callee name AND the literal shape) rather than a
  # bare `AIza.*`-style scan — either constraint alone produces far more
  # noise than this combination.
  - id: hardcoded-cloud-key-literal-to-sink
    languages: [php]
    severity: ERROR
    message: >
      A string literal matching a known cloud-provider API key format
      (Google/AWS/Stripe/Anthropic-shaped) is passed directly into a call
      whose name suggests it stores or encrypts a default value. This is
      the exact pattern that produced a real hardcoded Google API key in
      the optistate calibration plugin: OPTISTATE_Utils::encrypt_data()
      called with a literal key string instead of a value read from
      configuration. Trace: is this key real/live, and is it reachable by
      anyone who can read the resulting stored/encrypted value?
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    patterns:
      - pattern: $SINK(..., $KEY, ...)
      - metavariable-regex:
          metavariable: $SINK
          regex: '(?i).*(encrypt|default|option).*'
      - metavariable-regex:
          metavariable: $KEY
          regex: >-
            ^['"](AIza[0-9A-Za-z_\-]{35}|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk-ant-[A-Za-z0-9\-_]{20,}|sk-[A-Za-z0-9]{20,})['"]$

  # ---------------------------------------------------------------------
  # Rule 2: hardcoded cloud-provider key literal as a direct value in a
  # *_key/*_secret/*_token-named array entry (the raw-defaults-array
  # case, complementary to Rule 1's wrapped-in-a-call case).
  #
  # Does NOT match (tested, confirmed clean):
  #   - a key-shaped literal under an unrelated array key name (e.g.
  #     "example_documentation_value" => "AIzaSy...")
  #   - a *_api_key-named entry whose value is not actually key-shaped
  #     (e.g. "pagespeed_api_key" => "")
  - id: hardcoded-cloud-key-literal-in-defaults-array
    languages: [php]
    severity: ERROR
    message: >
      A string literal matching a known cloud-provider API key format is
      assigned directly as the value of an array key named like *_key /
      *_secret / *_token — a hardcoded credential in a defaults/config
      array, independent of whether it also passes through a sink call.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    patterns:
      - pattern: "[..., $KEYNAME => $VAL, ...]"
      - metavariable-regex:
          metavariable: $KEYNAME
          regex: '(?i)^[''"][a-z0-9_]*(api_key|secret|token)[a-z0-9_]*[''"]$'
      - metavariable-regex:
          metavariable: $VAL
          regex: >-
            ^['"](AIza[0-9A-Za-z_\-]{35}|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk-ant-[A-Za-z0-9\-_]{20,}|sk-[A-Za-z0-9]{20,})['"]$

  # ---------------------------------------------------------------------
  # Rule 3: unserialize()/maybe_unserialize() reachable from request/file
  # input, without the documented `allowed_classes` restriction.
  #
  # The real security-relevant control here is NOT is_serialized() (a
  # format check, not a safety control) — it's whether `unserialize()`'s
  # second argument restricts `allowed_classes` to `false` or `[]`.
  # maybe_unserialize() (WP core) has no way to pass that option at all,
  # so any tainted maybe_unserialize() call is unconditionally a match.
  #
  # Does NOT match (tested against optistate's real, manually-verified
  # call sites, confirmed clean):
  #   - unserialize($tainted, ["allowed_classes" => false])
  #   - unserialize($tainted, ["allowed_classes" => []])
  #     (optistate's search-replace.php bsr_unserialize() — the exact
  #     "is_serialized-safe path" this rule must not flag)
  #   - unserialize() on a hardcoded, non-tainted string
  #   - a tainted value that passed through is_serialized() first is
  #     treated as sanitized too (kept as a second, independent guard —
  #     real plugins sometimes rely on is_serialized() alone without an
  #     allowed_classes restriction; that is weaker but was explicitly
  #     named by the operator as an already-accepted safe pattern here)
  - id: unserialize-tainted-without-class-restriction
    languages: [php]
    mode: taint
    severity: ERROR
    message: >
      Request- or upload-derived data reaches unserialize()/
      maybe_unserialize() without an allowed_classes restriction — PHP
      Object Injection risk if any autoloadable class in the codebase has
      an exploitable __wakeup/__destruct/__toString. Confirm reachability
      end to end and check whether a gadget chain exists before filing.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: $_POST
          - pattern: $_GET
          - pattern: $_REQUEST
          - pattern: $_FILES
          - pattern: $_COOKIE
          - pattern: file_get_contents(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: unserialize($X)
              - pattern: maybe_unserialize($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: unserialize($X, $OPTS)
          - focus-metavariable: $X
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: '["allowed_classes" => false]'
                - pattern-not: '["allowed_classes" => []]'
    pattern-sanitizers:
      - pattern: is_serialized(...)

  # ---------------------------------------------------------------------
  # Rule 4: request-tainted data reaching a raw $wpdb query call without
  # going through $wpdb->prepare() or a recognized escaping/cast helper.
  #
  # IMPORTANT precision note from testing: $wpdb->prepare() can only
  # parameterize VALUES (%s/%d placeholders), never table/column
  # IDENTIFIERS — so the real WordPress-idiomatic safe pattern for a
  # dynamic identifier is concatenation *after* an identifier-escaping
  # call (esc_sql(), a plugin's own *escape_identifier* helper) or an
  # (int)/(float) cast, not prepare() at all. A first draft of this rule
  # that only excluded prepare()-wrapped calls produced 34 false
  # positives against optistate's restore-engine.php — a file already
  # manually verified as safe — because every one of those 34 hits was
  # exactly this identifier-escaping pattern. Fixed by switching to taint
  # mode with prepare() AND any *escape*/*esc_sql*/*esc_like*/*sanitize*/
  # intval/absint/quote_identifier-named call AND int/float casts as
  # sanitizers, which brought optistate back to 0 findings while keeping
  # the raw-concatenation true positive.
  #
  # Does NOT match (tested against optistate's real call sites, confirmed
  # clean — 0 findings across the full 38-file plugin):
  #   - $wpdb->prepare()-built queries, direct or nested
  #   - concatenation where the dynamic part passed through
  #     esc_sql()/*escape_identifier()/(int) cast/absint()/intval()
  #   - static SQL strings with no concatenation at all
  - id: wpdb-tainted-query-without-escaping
    languages: [php]
    mode: taint
    severity: ERROR
    message: >
      Request-derived data reaches a $wpdb query method without going
      through $wpdb->prepare() or a recognized escaping/cast helper.
      Confirm this is actually attacker-reachable and not already scoped
      by an upstream capability/nonce check before filing as SQLi.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: $_POST
          - pattern: $_GET
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $WPDB->query($SQL)
              - pattern: $WPDB->get_results($SQL, ...)
              - pattern: $WPDB->get_var($SQL)
              - pattern: $WPDB->get_row($SQL, ...)
              - pattern: $WPDB->get_col($SQL)
          - focus-metavariable: $SQL
    pattern-sanitizers:
      - pattern: $WPDB->prepare(...)
      - pattern: (int) $X
      - pattern: (float) $X
      - pattern: (integer) $X
      - patterns:
          - pattern: $ESC(...)
          - metavariable-regex:
              metavariable: $ESC
              regex: '(?i).*(escape|esc_sql|esc_like|sanitize|intval|absint|quote_identifier)+.*'
